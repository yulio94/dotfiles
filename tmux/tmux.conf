# Binds
bind r source-file ~/.tmux.conf

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# Plugin configuration
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Mouse configuration
set-option -g mouse on

set-option -g renumber-windows on

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:clipboard"

# Let agents reach ghostty: notifications (OSC 9/777), shift+enter, OSC 52 copy, focus.
set -g allow-passthrough on
set -s extended-keys on
set -s set-clipboard on
set -g focus-events on
set -g history-limit 50000

# Iceberg Dark, matches ghostty and nvim
set -g status-style "bg=#1e2132,fg=#c6c8d1"
set -g window-status-current-style "bg=#84a0c6,fg=#161821,bold"
set -g pane-border-style "fg=#1e2132"
set -g pane-active-border-style "fg=#84a0c6"
set -g message-style "bg=#1e2132,fg=#c6c8d1"

# resize panes
#―――――――――――――――――――――――――――――
bind -n M-H resize-pane -L 2
bind -n M-L resize-pane -R 2
bind -n M-K resize-pane -U 2
bind -n M-J resize-pane -D 2


# ghostty starts tmux outside a login shell, so without this the plugin scripts can't find tmux
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
